<header class="nav">
  <div class="wrap">
    <a class="brand" href="{% if page.home %}#top{% else %}/{% endif %}">Akash Ravi</a>
    <div class="nav-right">
      {%- if page.home %}
      <button
        class="icon-btn nav-toggle"
        type="button"
        data-nav-toggle
        aria-controls="primary-navigation"
        aria-expanded="false"
        aria-label="Open navigation"
      >
        {%- include icon.html name="menu" class="menu" -%} {%- include icon.html name="close"
        class="close" -%}
      </button>
      <nav id="primary-navigation" class="nav-links" aria-label="Primary">
        <a href="#about">About</a>
        <a href="#resume">Résumé</a>
        <a href="#elsewhere">Elsewhere</a>
        <a href="#contact">Contact</a>
      </nav>
      {%- endif %}
      <button
        class="icon-btn theme-toggle"
        type="button"
        data-theme-toggle
        aria-label="Switch theme"
        aria-pressed="false"
      >
        {%- include icon.html name="sun" class="sun" -%} {%- include icon.html name="moon"
        class="moon" -%}
      </button>
    </div>
  </div>
</header>
