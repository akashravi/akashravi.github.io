# Jekyll configuration — GitHub Pages builds the site from these sources.
# The shared page chrome lives in _layouts/ and _includes/; each page file
# only carries its own content plus a little front matter.
title: Akash Ravi
url: https://akashravi.github.io

# Google Drive file id for the résumé — the site embeds and links to it, so this
# is the only thing to change if the résumé ever moves to a different file.
resume_id: 1_mfqrYqnBg2KYWOGcoykjsqUkipdB4Nt

# Social-card copy, shared by the Open Graph and Twitter tags in _includes/seo.html.
social_description: "Product leader on Microsoft's SharePoint AI — hybrid search, retrieval, and ranking across Microsoft 365 and Copilot."

# Keep tooling/config out of the built _site output (dotfiles are ignored
# automatically; these are the non-dotfile dev files).
exclude:
  - README.md
  - LICENSE.txt
  - package.json
  - package-lock.json
  - node_modules
  - Gemfile
  - Gemfile.lock
  - vendor
