# Quality gates: build, formatting, linting, browser regressions, and Lighthouse budgets.
# Purely additive — never deploys, so it can't affect the live site.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build, lint, test & Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      # Builds dist, then runs every check against it (htmlhint lints the
      # built output, Lighthouse serves it as a static directory).
      - run: npm run lint

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Check portfolio interactions
        run: npm test

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./.lighthouserc.json
          temporaryPublicStorage: true
          uploadArtifacts: true
