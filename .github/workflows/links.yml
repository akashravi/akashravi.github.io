# Weekly broken-link check across the built site and the README.
#
# It checks dist rather than the sources because page URLs come from
# src/data via Mustache — only the built output has the
# real hrefs, and it's what visitors actually get.
name: Links

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays, 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Build static site
        run: npm run build

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        env:
          # Authenticated GitHub API calls, so github.com links aren't rejected by
          # the much lower unauthenticated rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 403/429 mean "this host blocks bots", not "this link is dead". Several
          # of the linked sites (Google Scholar, Codeforces, HackerEarth) sit behind
          # bot protection and answer 403 at random, which is what used to fail this
          # job for no real reason. Genuine breakage — 404/410, 5xx, DNS errors,
          # timeouts — still fails. Hosts that can't be checked at all, because they
          # reject GET outright, are listed in .lycheeignore.
          args: >-
            --no-progress
            --max-concurrency 4
            --max-retries 3
            --retry-wait-time 10
            --timeout 30
            --accept 200..=299,403,429
            --root-dir "${{ github.workspace }}/dist"
            "dist/**/*.html" README.md
          fail: true
          jobSummary: true
